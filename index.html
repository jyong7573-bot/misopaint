<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>경기도료 KCC페인트대리점</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column, as a customer sees it right after scanning. Registration by text message, then account, then price lookup. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #131a2b;
  --muted: #5b657a;
  --faint: #8590a6;
  --line: #d5dbe6;
  --accent: #1f4fd8;
  --accent-ink: #ffffff;
  --accent-soft: #e4ebfd;
  --ok: #0f7a4d;
  --note-bg: #fff4d6;
  --note-ink: #6b4a00;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1320; --surface: #182033; --ink: #eef1f8; --muted: #a0abc2; --faint: #7985a0; --line: #2e3950;
    --accent: #7c9bff; --accent-ink: #0b1226; --accent-soft: #222e4d; --ok: #5fd39f;
    --note-bg: #3a2f10; --note-ink: #ffe09a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #182033; --ink: #eef1f8; --muted: #a0abc2; --faint: #7985a0; --line: #2e3950;
  --accent: #7c9bff; --accent-ink: #0b1226; --accent-soft: #222e4d; --ok: #5fd39f;
  --note-bg: #3a2f10; --note-ink: #ffe09a; color-scheme: dark;
}
img{max-width:100%}[hidden]{display:none!important}
body { margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.4;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.note { background: var(--note-bg); color: var(--note-ink); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin: 0; }
header h1 { font-size: 24px; font-weight: 700; margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
header a { color: var(--accent); font-weight: 500; white-space: nowrap; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
h2 { font-size: 17px; font-weight: 600; margin: 0; }
.bank { color: var(--ink); font-size: 20px; font-weight: 700; }
.acct { font-family: var(--mono); font-size: clamp(26px, 8vw, 34px); white-space: nowrap; font-weight: 600; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; user-select: all; overflow-wrap: anywhere; }
.holder { font-size: 15px; }
.holder span { color: var(--muted); }
button.primary, a.primary {
  font: inherit; font-weight: 600; border-radius: 10px; padding: 14px 16px; min-height: 52px;
  border: 1px solid transparent; cursor: pointer; text-align: center; box-sizing: border-box; width: 100%;
  background: var(--accent); color: var(--accent-ink); display: block; text-decoration: none;
}
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.status { font-size: 14px; color: var(--ok); font-weight: 500; min-height: 1.5em; margin: 0; }
input[type="search"] {
  font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); min-width: 0; width: 100%; box-sizing: border-box;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button {
  font: inherit; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.chips button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.legend { font-size: 13px; text-align: right; margin-bottom: -6px; }
.legend .ex { color: var(--faint); font-size: 12px; }
.legend .inc { color: var(--ink); font-weight: 600; }
.prices { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.prices li { padding: 8px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.prices .item { font-weight: 600; overflow-wrap: anywhere; }
.prices .item span { font-weight: 400; color: var(--muted); }
.sizes { display: grid; grid-template-columns: auto 1fr auto; column-gap: 10px; row-gap: 0; align-items: baseline; font-variant-numeric: tabular-nums; }
.sizes .sz { font-size: 13px; color: var(--muted); }
.sizes .ex { font-size: 12px; color: var(--faint); text-align: right; white-space: nowrap; }
.sizes .inc { font-family: var(--mono); font-size: 17px; font-weight: 600; text-align: right; white-space: nowrap; }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>경기도료 KCC페인트대리점</h1>
    <p>연락처 <a href="tel:01094637563">010-9463-7563</a> / <a href="tel:0326757573">032-675-7573</a></p>
  </header>

  <section aria-labelledby="h-biz">
    <h2 id="h-biz">사업자등록증 보내기</h2>
    <p class="hint">세금계산서 발행에 필요합니다. 아래 버튼을 누르면 문자 창이 열립니다. 사업자등록증 사진을 첨부해서 보내주세요.</p>
    <a class="primary" href="sms:01094637563?&body=%EC%82%AC%EC%97%85%EC%9E%90%EB%93%B1%EB%A1%9D%EC%A6%9D%20%EB%B3%B4%EB%82%B4%EB%93%9C%EB%A6%BD%EB%8B%88%EB%8B%A4.">문자로 사업자등록증 보내기</a>
    <p class="hint">버튼이 안 열리면 010-9463-7563으로 문자를 보내주세요.</p>
  </section>

  <section aria-labelledby="h-acct">
    <h2 id="h-acct">입금 계좌</h2>
    <div>
      <div class="bank">하나은행</div>
      <div class="acct" id="acct">478-810334-47707</div>
      <div class="holder"><span>예금주</span> 이정희(경기도료)</div>
    </div>
    <button type="button" class="primary" id="copy">계좌번호 복사</button>
    <p class="status" id="acct-status" role="status"></p>
  </section>

</div>

<script>
const $ = id => document.getElementById(id);

$('copy').addEventListener('click', () => {
  const st = $('acct-status');
  const text = $('acct').textContent.replace(/-/g, '');
  const done = () => { st.textContent = '계좌번호를 복사했습니다. 은행 앱에 붙여넣으세요.'; };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents($('acct'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    st.textContent = '계좌번호를 선택했습니다. 길게 눌러 복사하세요.';
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
});

</script>
</body>
</html>
